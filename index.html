<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONOS // Experimental Additive Drone Synthesizer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Unified Background Canvas -->
        <canvas id="canvas-visualizer"></canvas>

        <!-- Overlay Header -->
        <header class="overlay-header">
            <div class="header-left">
                <span class="brand">KRONOS</span>
                <span class="tagline">drone synthesis laboratory</span>
            </div>
            <div class="header-right">
                <span class="build-version">BUILD #{{BUILD_NUMBER}}</span>
            </div>
        </header>

        <!-- Left Side Floating Control Panel -->
        <section class="control-panel-left">
            <div class="sliders-container" id="lanes-left">
                <!-- Lane 1 (Source) -->
                <div class="slider-wrapper mod-lane" data-lane="1" data-param="mod1_macro">
                    <div class="slider-header">
                        <div class="drag-handle" style="visibility: hidden;">⇿</div>
                        <span class="slider-name">SOURCE</span>
                        <span class="slider-val" id="val-mod1_macro">0.00</span>
                    </div>
                    <div class="custom-slider" id="slider-mod1_macro">
                        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
                    </div>
                    <div class="dsp-edit-toggle" data-target="mod1"></div>
                </div>

                <!-- Lane 2 -->
                <div class="slider-wrapper mod-lane" data-lane="2" data-param="mod2_macro">
                    <div class="slider-header">
                        <div class="drag-handle">⇿</div>
                        <select class="slider-name engine-selector">
                            <option value="empty" selected>EMPTY</option>
                            <option value="filter">FILTER</option>
                            <option value="space">SPACE</option>
                            <option value="pitch">PITCH</option>
                            <option value="alter">ALTER</option>
                            <option value="cloud">CLOUD</option>
                            <option value="desync">DE-SYNC</option>
                        </select>
                        <span class="slider-val" id="val-mod2_macro">0.00</span>
                    </div>
                    <div class="custom-slider" id="slider-mod2_macro">
                        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
                    </div>
                    <div class="dsp-edit-toggle" data-target="mod2"></div>
                </div>

                <!-- Lane 3 -->
                <div class="slider-wrapper mod-lane" data-lane="3" data-param="mod3_macro">
                    <div class="slider-header">
                        <div class="drag-handle">⇿</div>
                        <select class="slider-name engine-selector">
                            <option value="empty" selected>EMPTY</option>
                            <option value="filter">FILTER</option>
                            <option value="space">SPACE</option>
                            <option value="pitch">PITCH</option>
                            <option value="alter">ALTER</option>
                            <option value="cloud">CLOUD</option>
                            <option value="desync">DE-SYNC</option>
                        </select>
                        <span class="slider-val" id="val-mod3_macro">0.00</span>
                    </div>
                    <div class="custom-slider" id="slider-mod3_macro">
                        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
                    </div>
                    <div class="dsp-edit-toggle" data-target="mod3"></div>
                </div>

                <!-- Lane 4 -->
                <div class="slider-wrapper mod-lane" data-lane="4" data-param="mod4_macro">
                    <div class="slider-header">
                        <div class="drag-handle">⇿</div>
                        <select class="slider-name engine-selector">
                            <option value="empty" selected>EMPTY</option>
                            <option value="filter">FILTER</option>
                            <option value="space">SPACE</option>
                            <option value="pitch">PITCH</option>
                            <option value="alter">ALTER</option>
                            <option value="cloud">CLOUD</option>
                            <option value="desync">DE-SYNC</option>
                        </select>
                        <span class="slider-val" id="val-mod4_macro">0.00</span>
                    </div>
                    <div class="custom-slider" id="slider-mod4_macro">
                        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
                    </div>
                    <div class="dsp-edit-toggle" data-target="mod4"></div>
                </div>
            </div>

            <div class="dsp-edit-area" id="dsp-area-left">
                <!-- Dynamically injected Left Panels go here -->
            </div>
        </section>

        <!-- Right Side Floating Control Panel (Symmetric Sliders) -->
        <section class="control-panel-right">
            <div class="sliders-container" id="lanes-right">
                <!-- Lane 5 -->
                <div class="slider-wrapper mod-lane" data-lane="5" data-param="mod5_macro">
                    <div class="slider-header">
                        <div class="drag-handle">⇿</div>
                        <select class="slider-name engine-selector">
                            <option value="empty" selected>EMPTY</option>
                            <option value="filter">FILTER</option>
                            <option value="space">SPACE</option>
                            <option value="pitch">PITCH</option>
                            <option value="alter">ALTER</option>
                            <option value="cloud">CLOUD</option>
                            <option value="desync">DE-SYNC</option>
                        </select>
                        <span class="slider-val" id="val-mod5_macro">0.00</span>
                    </div>
                    <div class="custom-slider" id="slider-mod5_macro">
                        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
                    </div>
                    <div class="dsp-edit-toggle" data-target="mod5"></div>
                </div>

                <!-- Lane 6 -->
                <div class="slider-wrapper mod-lane" data-lane="6" data-param="mod6_macro">
                    <div class="slider-header">
                        <div class="drag-handle">⇿</div>
                        <select class="slider-name engine-selector">
                            <option value="empty" selected>EMPTY</option>
                            <option value="filter">FILTER</option>
                            <option value="space">SPACE</option>
                            <option value="pitch">PITCH</option>
                            <option value="alter">ALTER</option>
                            <option value="cloud">CLOUD</option>
                            <option value="desync">DE-SYNC</option>
                        </select>
                        <span class="slider-val" id="val-mod6_macro">0.00</span>
                    </div>
                    <div class="custom-slider" id="slider-mod6_macro">
                        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
                    </div>
                    <div class="dsp-edit-toggle" data-target="mod6"></div>
                </div>

                <!-- Lane 7 -->
                <div class="slider-wrapper mod-lane" data-lane="7" data-param="mod7_macro">
                    <div class="slider-header">
                        <div class="drag-handle">⇿</div>
                        <select class="slider-name engine-selector">
                            <option value="empty" selected>EMPTY</option>
                            <option value="filter">FILTER</option>
                            <option value="space">SPACE</option>
                            <option value="pitch">PITCH</option>
                            <option value="alter">ALTER</option>
                            <option value="cloud">CLOUD</option>
                            <option value="desync">DE-SYNC</option>
                        </select>
                        <span class="slider-val" id="val-mod7_macro">0.00</span>
                    </div>
                    <div class="custom-slider" id="slider-mod7_macro">
                        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
                    </div>
                    <div class="dsp-edit-toggle" data-target="mod7"></div>
                </div>

                <!-- Lane 8 -->
                <div class="slider-wrapper mod-lane" data-lane="8" data-param="mod8_macro">
                    <div class="slider-header">
                        <div class="drag-handle">⇿</div>
                        <select class="slider-name engine-selector">
                            <option value="empty" selected>EMPTY</option>
                            <option value="filter">FILTER</option>
                            <option value="space">SPACE</option>
                            <option value="pitch">PITCH</option>
                            <option value="alter">ALTER</option>
                            <option value="cloud">CLOUD</option>
                            <option value="desync">DE-SYNC</option>
                        </select>
                        <span class="slider-val" id="val-mod8_macro">0.00</span>
                    </div>
                    <div class="custom-slider" id="slider-mod8_macro">
                        <div class="slider-track"><div class="slider-fill"></div><div class="slider-thumb"></div></div>
                    </div>
                    <div class="dsp-edit-toggle" data-target="mod8"></div>
                </div>
            </div>
            
            <div class="dsp-edit-area" id="dsp-area-right">
                <!-- Dynamically injected Right Panels go here -->
            </div>
        </section>

        <!-- HTML TEMPLATES FOR DYNAMIC ENGINE INJECTION -->
        
        <!-- SOURCE ENGINE TEMPLATE -->
        <template id="tmpl-engine-source">
            <div class="dsp-panel engine-source-panel">
                <div class="filter-ui-canvas-container">
                    <canvas id="source-ui-canvas"></canvas>
                </div>
                <div class="filter-morph-row" style="visibility: hidden;"></div>
                <div class="filter-params-row">
                    <div class="knob-wrapper" data-param="mod{{LANE}}_p1">
                        <div class="custom-knob filter-knob" id="knob-mod{{LANE}}_p1" data-min="1" data-max="512" data-default="256">
                            <div class="knob-dial"><div class="knob-marker"></div></div>
                        </div>
                        <div class="knob-names">
                            <span class="knob-name-a">PARTIALS</span>
                        </div>
                        <span class="knob-val" id="val-mod{{LANE}}_p1">256</span>
                    </div>
                    <div class="knob-wrapper" data-param="mod{{LANE}}_p2">
                        <div class="custom-knob filter-knob bipolar-knob" id="knob-mod{{LANE}}_p2" data-bipolar="true">
                            <div class="knob-dial"><div class="knob-marker"></div></div>
                        </div>
                        <div class="knob-names">
                            <span class="knob-name-a">BALANCE</span>
                        </div>
                        <span class="knob-val" id="val-mod{{LANE}}_p2">0.00</span>
                    </div>
                    <div class="knob-wrapper" data-param="mod{{LANE}}_p3">
                        <div class="custom-knob filter-knob bipolar-knob" id="knob-mod{{LANE}}_p3" data-bipolar="true">
                            <div class="knob-dial"><div class="knob-marker"></div></div>
                        </div>
                        <div class="knob-names">
                            <span class="knob-name-a">WIDTH</span>
                        </div>
                        <span class="knob-val" id="val-mod{{LANE}}_p3">0.00</span>
                    </div>
                    <div class="knob-wrapper" data-param="mod{{LANE}}_p4" style="opacity: 0.5;">
                        <div class="custom-knob filter-knob" id="knob-mod{{LANE}}_p4">
                            <div class="knob-dial"><div class="knob-marker"></div></div>
                        </div>
                        <div class="knob-names">
                            <span class="knob-name-a">AUX</span>
                        </div>
                        <span class="knob-val" id="val-mod{{LANE}}_p4">0.00</span>
                    </div>
                </div>
            </div>
        </template>

        <!-- FILTER ENGINE TEMPLATE -->
        <template id="tmpl-engine-filter">
        <div class="dsp-panel engine-filter-panel">
            <div class="filter-ui-canvas-container">
                <canvas id="filter-ui-canvas"></canvas>
            </div>
            <div class="filter-morph-row">
                <div class="filter-type" id="filter-type-a-{{LANE}}">
                    <span class="type-cycle cycle-left">&lt;</span>
                    <span class="type-label">LP</span>
                    <span class="type-cycle cycle-right">&gt;</span>
                </div>
                <div class="morph-slider-container" data-param="mod{{LANE}}_p5">
                    <div class="mod-line-container" data-mod-param="mod{{LANE}}_p5_mod">
                        <div class="mod-line-bg"></div>
                        <div class="mod-line-fill"></div>
                    </div>
                    <div class="custom-slider horizontal" id="slider-mod{{LANE}}_p5" data-mod-param="mod{{LANE}}_p5_mod">
                        <div class="slider-track horizontal-track">
                            <div class="slider-fill horizontal-fill"></div>
                            <div class="slider-thumb horizontal-thumb"></div>
                        </div>
                    </div>
                </div>
                <div class="filter-type" id="filter-type-b-{{LANE}}">
                    <span class="type-cycle cycle-left">&lt;</span>
                    <span class="type-label">LP</span>
                    <span class="type-cycle cycle-right">&gt;</span>
                </div>
            </div>
            <div class="filter-params-row">
                <div class="knob-wrapper" data-param="mod{{LANE}}_p1">
                    <div class="custom-knob filter-knob has-mod" id="knob-mod{{LANE}}_p1" data-mod-param="mod{{LANE}}_p1_mod">
                        <svg class="mod-ring-svg" viewBox="0 0 100 100"><path class="mod-ring-bg" d="M 17.47 82.53 A 46 46 0 1 1 82.53 82.53" /><path class="mod-ring-arc" d="" /></svg>
                        <div class="knob-dial"><div class="knob-marker"></div></div>
                    </div>
                    <div class="knob-names">
                        <span class="knob-name-a">CUTOFF</span>
                        <span class="knob-name-b">CUTOFF</span>
                    </div>
                    <span class="knob-val" id="val-mod{{LANE}}_p1">0.75</span>
                </div>
                <div class="knob-wrapper" data-param="mod{{LANE}}_p2">
                    <div class="custom-knob filter-knob bipolar-knob has-mod" id="knob-mod{{LANE}}_p2" data-bipolar="true" data-mod-param="mod{{LANE}}_p2_mod">
                        <svg class="mod-ring-svg" viewBox="0 0 100 100"><path class="mod-ring-bg" d="M 17.47 82.53 A 46 46 0 1 1 82.53 82.53" /><path class="mod-ring-arc" d="" /></svg>
                        <div class="knob-dial"><div class="knob-marker"></div></div>
                    </div>
                    <div class="knob-names">
                        <span class="knob-name-a">OFFSET</span>
                        <span class="knob-name-b">OFFSET</span>
                    </div>
                    <span class="knob-val" id="val-mod{{LANE}}_p2">0.00</span>
                </div>
                <div class="knob-wrapper" data-param="mod{{LANE}}_p3">
                    <div class="custom-knob filter-knob has-mod" id="knob-mod{{LANE}}_p3" data-mod-param="mod{{LANE}}_p3_mod">
                        <svg class="mod-ring-svg" viewBox="0 0 100 100"><path class="mod-ring-bg" d="M 17.47 82.53 A 46 46 0 1 1 82.53 82.53" /><path class="mod-ring-arc" d="" /></svg>
                        <div class="knob-dial"><div class="knob-marker"></div></div>
                    </div>
                    <div class="knob-names">
                        <span class="knob-name-a">RESO</span>
                        <span class="knob-name-b">RESO</span>
                    </div>
                    <span class="knob-val" id="val-mod{{LANE}}_p3">0.20</span>
                </div>
                <div class="knob-wrapper" data-param="mod{{LANE}}_p4">
                    <div class="custom-knob filter-knob has-mod" id="knob-mod{{LANE}}_p4" data-mod-param="mod{{LANE}}_p4_mod">
                        <svg class="mod-ring-svg" viewBox="0 0 100 100"><path class="mod-ring-bg" d="M 17.47 82.53 A 46 46 0 1 1 82.53 82.53" /><path class="mod-ring-arc" d="" /></svg>
                        <div class="knob-dial"><div class="knob-marker"></div></div>
                    </div>
                    <div class="knob-names">
                        <span class="knob-name-a">SLOPE</span>
                        <span class="knob-name-b">SLOPE</span>
                    </div>
                    <span class="knob-val" id="val-mod{{LANE}}_p4">0.50</span>
                </div>
            </div>
        </div>
        </template>
    </div>
    
    <script src="app.js?v=1788029963"></script>
<script>
  setTimeout(() => {
    const el = document.querySelector('.mod-line-container');
    if (el) {
      const rect = el.getBoundingClientRect();
      console.log('DEBUG_RECT:', JSON.stringify(rect));
      const clickTarget = document.elementFromPoint(rect.x + rect.width/2, rect.y + rect.height/2);
      console.log('DEBUG_TARGET:', clickTarget ? clickTarget.tagName + '.' + clickTarget.className : 'null');
    } else {
      console.log('DEBUG_RECT: NOT_FOUND');
    }
  }, 1000);
</script>
</body>
</html>
